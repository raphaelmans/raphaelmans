<svg xmlns="http://www.w3.org/2000/svg" width="360" height="690" viewBox="0 0 360 690" role="img" aria-labelledby="title desc">
  <title id="title">Mobile CravingsPH transaction and state model</title>
  <desc id="desc">A readable command flow through transaction safety into lifecycle, payment, and fulfillment regions before realtime reconciliation.</desc>
  <rect width="360" height="690" rx="20" fill="#f6f6f3"/>
  <text x="24" y="42" fill="#18181b" font-family="Arial, sans-serif" font-size="22" font-weight="700">One command, three states</text>
  <text x="24" y="66" fill="#52525b" font-family="Arial, sans-serif" font-size="14">Transaction model · mobile summary</text>
  <g font-family="Arial, sans-serif">
    <rect x="24" y="92" width="312" height="74" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="44" y="121" fill="#075985" font-size="14" font-weight="700">COMMAND SOURCE</text>
    <text x="44" y="147" fill="#18181b" font-size="17" font-weight="700">Staff · guest · paired kiosk</text>
    <path d="M180 166v24" stroke="#0369a1" stroke-width="3"/>
    <rect x="24" y="190" width="312" height="96" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <text x="44" y="221" fill="#075985" font-size="14" font-weight="700">TRANSACTION BOUNDARY</text>
    <text x="44" y="249" fill="#18181b" font-size="16" font-weight="700">Command ID → dedupe → row locks</text>
    <text x="44" y="271" fill="#52525b" font-size="14">Retry or benign conflict</text>
    <path d="M180 286v24" stroke="#0369a1" stroke-width="3"/>
    <rect x="24" y="310" width="312" height="230" rx="14" fill="#fff" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="44" y="343" fill="#52525b" font-size="14" font-weight="700">ATOMIC UPDATE</text>
    <rect x="44" y="363" width="272" height="46" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="60" y="392" fill="#18181b" font-size="15" font-weight="700">Lifecycle · open → closed</text>
    <rect x="44" y="423" width="272" height="46" rx="10" fill="#ecfeff" stroke="#0e7490"/>
    <text x="60" y="452" fill="#18181b" font-size="15" font-weight="700">Payment · unpaid → settled</text>
    <rect x="44" y="483" width="272" height="46" rx="10" fill="#f4f4f5" stroke="#71717a"/>
    <text x="60" y="512" fill="#18181b" font-size="15" font-weight="700">Fulfillment · queued → served</text>
    <path d="M180 540v24" stroke="#0369a1" stroke-width="3"/>
    <rect x="24" y="564" width="312" height="92" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="44" y="595" fill="#075985" font-size="14" font-weight="700">AFTER COMMIT</text>
    <text x="44" y="623" fill="#18181b" font-size="16" font-weight="700">Realtime event → reconcile cache</text>
    <text x="44" y="645" fill="#52525b" font-size="14">Persisted state remains authoritative</text>
  </g>
</svg>
