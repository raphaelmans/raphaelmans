<svg xmlns="http://www.w3.org/2000/svg" width="360" height="610" viewBox="0 0 360 610" role="img" aria-labelledby="title desc">
  <title id="title">Mobile Ample News observability model</title>
  <desc id="desc">A readable trace summary connecting public run context to agent, tool, model, service, and persisted application events.</desc>
  <rect width="360" height="610" rx="20" fill="#f6f6f3"/>
  <text x="24" y="42" fill="#18181b" font-family="Arial, sans-serif" font-size="22" font-weight="700">One run, five boundaries</text>
  <text x="24" y="66" fill="#52525b" font-family="Arial, sans-serif" font-size="14">Redacted observability summary</text>
  <g font-family="Arial, sans-serif">
    <rect x="24" y="92" width="312" height="74" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="44" y="121" fill="#075985" font-size="14" font-weight="700">PUBLIC RUN CONTEXT</text>
    <text x="44" y="147" fill="#18181b" font-size="16" font-weight="700">stage · attempt · state · elapsed</text>
    <path d="M180 166v24" stroke="#0369a1" stroke-width="3"/>
    <rect x="24" y="190" width="312" height="250" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="44" y="225" fill="#075985" font-size="14" font-weight="700">01 · AGENT</text>
    <text x="154" y="225" fill="#18181b" font-size="15">intent + bounded context</text>
    <text x="44" y="267" fill="#075985" font-size="14" font-weight="700">02 · TOOL</text>
    <text x="154" y="267" fill="#18181b" font-size="15">read / confirm / result</text>
    <text x="44" y="309" fill="#075985" font-size="14" font-weight="700">03 · MODEL</text>
    <text x="154" y="309" fill="#18181b" font-size="15">tokens + latency</text>
    <text x="44" y="351" fill="#075985" font-size="14" font-weight="700">04 · SERVICE</text>
    <text x="154" y="351" fill="#18181b" font-size="15">media + delivery state</text>
    <text x="44" y="393" fill="#075985" font-size="14" font-weight="700">05 · APP</text>
    <text x="154" y="393" fill="#18181b" font-size="15">persisted run + error</text>
    <rect x="24" y="464" width="312" height="112" rx="14" fill="#fff" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="44" y="497" fill="#52525b" font-size="14" font-weight="700">REVIEW</text>
    <text x="44" y="525" fill="#18181b" font-size="15">Where did work stop or retry?</text>
    <text x="44" y="552" fill="#18181b" font-size="15">Did delivery and app state agree?</text>
  </g>
</svg>
