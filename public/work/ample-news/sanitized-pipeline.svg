<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Ample News production pipeline</title>
  <desc id="desc">A public pipeline from grounded company and news context through typed AI stages, human confirmation and interview capture, media processing, platform publishing, and telemetry.</desc>
  <rect width="1000" height="820" rx="28" fill="#f6f6f3"/>
  <text x="64" y="74" fill="#18181b" font-family="Arial, sans-serif" font-size="32" font-weight="700">From grounded research to observable publishing</text>
  <text x="64" y="110" fill="#52525b" font-family="Arial, sans-serif" font-size="20">Sanitized public workflow · provider and customer detail intentionally omitted</text>

  <g font-family="Arial, sans-serif">
    <rect x="64" y="158" width="872" height="94" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <circle cx="112" cy="205" r="24" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="104" y="214" fill="#075985" font-size="24" font-weight="700">1</text>
    <text x="160" y="195" fill="#18181b" font-size="24" font-weight="700">Grounded context and current-news evidence</text>
    <text x="160" y="226" fill="#52525b" font-size="18">Company and audience context · bounded search · source-linked candidates</text>

    <path d="M112 252v30" stroke="#0369a1" stroke-width="3"/><path d="m103 274 9 10 9-10" fill="none" stroke="#0369a1" stroke-width="3"/>
    <rect x="64" y="282" width="872" height="94" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <circle cx="112" cy="329" r="24" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="104" y="338" fill="#075985" font-size="24" font-weight="700">2</text>
    <text x="160" y="319" fill="#18181b" font-size="24" font-weight="700">Typed workflow stages and persisted runs</text>
    <text x="160" y="350" fill="#52525b" font-size="18">Structured handoffs · provider boundaries · retry and failure state</text>

    <path d="M112 376v30" stroke="#0369a1" stroke-width="3"/><path d="m103 398 9 10 9-10" fill="none" stroke="#0369a1" stroke-width="3"/>
    <rect x="64" y="406" width="872" height="106" rx="16" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
    <circle cx="112" cy="459" r="24" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="104" y="468" fill="#075985" font-size="24" font-weight="700">3</text>
    <text x="160" y="447" fill="#18181b" font-size="24" font-weight="700">Human confirmation and interview capture</text>
    <text x="160" y="478" fill="#52525b" font-size="18">Read → confirm → write for mutations · voice session · transcript</text>
    <text x="160" y="500" fill="#075985" font-size="16" font-weight="700">Explicit user boundary before state-changing actions</text>

    <path d="M500 512v42M500 554H270v24M500 554h230v24" fill="none" stroke="#0369a1" stroke-width="3"/>
    <path d="m261 570 9 10 9-10M721 570l9 10 9-10" fill="none" stroke="#0369a1" stroke-width="3"/>

    <rect x="64" y="580" width="408" height="120" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="92" y="619" fill="#075985" font-size="17" font-weight="700">4 · MEDIA PIPELINE</text>
    <text x="92" y="653" fill="#18181b" font-size="22" font-weight="700">Video · captions · clips</text>
    <text x="92" y="680" fill="#52525b" font-size="17">Webhook-driven processing and preview</text>

    <rect x="528" y="580" width="408" height="120" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="556" y="619" fill="#075985" font-size="17" font-weight="700">5 · DISTRIBUTION</text>
    <text x="556" y="653" fill="#18181b" font-size="22" font-weight="700">Platform-specific posts</text>
    <text x="556" y="680" fill="#52525b" font-size="17">Planned → scheduled → posted / failed</text>

    <rect x="64" y="730" width="872" height="52" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="92" y="763" fill="#075985" font-size="18" font-weight="700">Across every stage: correlated logs · AI traces · latency, token, cost, and delivery state</text>
  </g>
</svg>
