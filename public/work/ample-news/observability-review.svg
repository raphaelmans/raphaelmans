<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Redacted Ample News observability review model</title>
  <desc id="desc">A sanitized observability view connecting one public workflow run to agent, tool, model, integration, and application events with reviewable latency, cost, and delivery state.</desc>
  <rect width="1000" height="720" rx="28" fill="#f6f6f3"/>
  <text x="64" y="74" fill="#18181b" font-family="Arial, sans-serif" font-size="32" font-weight="700">One workflow run, correlated across boundaries</text>
  <text x="64" y="110" fill="#52525b" font-family="Arial, sans-serif" font-size="20">Redacted observability model · no raw trace or customer data</text>

  <g font-family="Arial, sans-serif">
    <rect x="64" y="154" width="872" height="86" rx="16" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
    <text x="92" y="189" fill="#075985" font-size="17" font-weight="700">PUBLIC RUN CONTEXT</text>
    <text x="92" y="219" fill="#18181b" font-size="22" font-weight="700">workflow stage · attempt · status · elapsed time</text>

    <path d="M500 240v44M150 284h700" stroke="#0369a1" stroke-width="3"/>
    <path d="M150 284v30M325 284v30M500 284v30M675 284v30M850 284v30" stroke="#0369a1" stroke-width="3"/>

    <rect x="64" y="314" width="172" height="116" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="86" y="352" fill="#075985" font-size="16" font-weight="700">01 · AGENT</text>
    <text x="86" y="385" fill="#18181b" font-size="20" font-weight="700">Intent and turn</text>
    <text x="86" y="412" fill="#52525b" font-size="16">bounded context</text>

    <rect x="239" y="314" width="172" height="116" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="261" y="352" fill="#075985" font-size="16" font-weight="700">02 · TOOL</text>
    <text x="261" y="385" fill="#18181b" font-size="20" font-weight="700">Read / confirm</text>
    <text x="261" y="412" fill="#52525b" font-size="16">input and result</text>

    <rect x="414" y="314" width="172" height="116" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="436" y="352" fill="#075985" font-size="16" font-weight="700">03 · MODEL</text>
    <text x="436" y="385" fill="#18181b" font-size="20" font-weight="700">Provider call</text>
    <text x="436" y="412" fill="#52525b" font-size="16">tokens and latency</text>

    <rect x="589" y="314" width="172" height="116" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="611" y="352" fill="#075985" font-size="16" font-weight="700">04 · SERVICE</text>
    <text x="611" y="385" fill="#18181b" font-size="20" font-weight="700">Media / social</text>
    <text x="611" y="412" fill="#52525b" font-size="16">delivery state</text>

    <rect x="764" y="314" width="172" height="116" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="786" y="352" fill="#075985" font-size="16" font-weight="700">05 · APP</text>
    <text x="786" y="385" fill="#18181b" font-size="20" font-weight="700">Persisted run</text>
    <text x="786" y="412" fill="#52525b" font-size="16">status and error</text>

    <rect x="64" y="482" width="872" height="158" rx="18" fill="#ffffff" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="92" y="521" fill="#52525b" font-size="17" font-weight="700">REVIEW QUESTIONS</text>
    <text x="92" y="559" fill="#18181b" font-size="21">Where did the run stop, retry, or wait for confirmation?</text>
    <text x="92" y="590" fill="#18181b" font-size="21">Which model, tool, or integration dominated latency and cost?</text>
    <text x="92" y="621" fill="#18181b" font-size="21">Did the final persisted and delivery states agree?</text>
  </g>
  <text x="64" y="684" fill="#71717a" font-family="Arial, sans-serif" font-size="17">This purpose-built diagram replaces unsafe raw telemetry in the public case study.</text>
</svg>
