<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">KudosCourts reviewed system path</title>
  <desc id="desc">A five-stage path from fragmented venue evidence through human-reviewed ingestion and a typed product core to web, mobile, and operational workflows.</desc>
  <rect width="1000" height="760" rx="28" fill="#f6f6f3"/>
  <text x="64" y="76" fill="#18181b" font-family="Arial, sans-serif" font-size="32" font-weight="700">From fragmented evidence to an operated product</text>
  <text x="64" y="112" fill="#52525b" font-family="Arial, sans-serif" font-size="20">Reviewed public model · deterministic writes follow human review</text>

  <g font-family="Arial, sans-serif">
    <rect x="64" y="166" width="872" height="92" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <circle cx="112" cy="212" r="24" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="104" y="221" fill="#075985" font-size="24" font-weight="700">1</text>
    <text x="160" y="202" fill="#18181b" font-size="25" font-weight="700">Evidence capture</text>
    <text x="160" y="232" fill="#52525b" font-size="19">Websites · social pages · search · maps · owner-provided records</text>

    <path d="M112 258v28" stroke="#0369a1" stroke-width="3"/>
    <path d="m103 278 9 10 9-10" fill="none" stroke="#0369a1" stroke-width="3"/>

    <rect x="64" y="286" width="872" height="112" rx="16" fill="#ffffff" stroke="#0369a1" stroke-width="3"/>
    <circle cx="112" cy="342" r="24" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="104" y="351" fill="#075985" font-size="24" font-weight="700">2</text>
    <text x="160" y="326" fill="#18181b" font-size="25" font-weight="700">Review-gated ingestion</text>
    <text x="160" y="356" fill="#52525b" font-size="19">Extract and normalize → check provenance, duplicates, and locality</text>
    <text x="160" y="382" fill="#075985" font-size="18" font-weight="700">Human approval is required before deterministic persistence</text>

    <path d="M112 398v28" stroke="#0369a1" stroke-width="3"/>
    <path d="m103 418 9 10 9-10" fill="none" stroke="#0369a1" stroke-width="3"/>

    <rect x="64" y="426" width="872" height="92" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <circle cx="112" cy="472" r="24" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="104" y="481" fill="#075985" font-size="24" font-weight="700">3</text>
    <text x="160" y="462" fill="#18181b" font-size="25" font-weight="700">Typed product core</text>
    <text x="160" y="492" fill="#52525b" font-size="19">Validated contracts · transactional PostgreSQL services · outbox delivery</text>

    <path d="M500 518v28M500 546H270v25M500 546h230v25" fill="none" stroke="#0369a1" stroke-width="3"/>
    <path d="m261 563 9 10 9-10M721 563l9 10 9-10" fill="none" stroke="#0369a1" stroke-width="3"/>

    <rect x="64" y="571" width="408" height="112" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="92" y="612" fill="#075985" font-size="18" font-weight="700">4 · CUSTOMER SURFACES</text>
    <text x="92" y="646" fill="#18181b" font-size="24" font-weight="700">Next.js web + Expo mobile</text>
    <text x="92" y="672" fill="#52525b" font-size="17">Shared concepts with contract-drift checks</text>

    <rect x="528" y="571" width="408" height="112" rx="16" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="556" y="612" fill="#075985" font-size="18" font-weight="700">5 · OPERATIONS</text>
    <text x="556" y="646" fill="#18181b" font-size="24" font-weight="700">Owners, realtime, notifications</text>
    <text x="556" y="672" fill="#52525b" font-size="17">Observable delivery and recovery state</text>
  </g>
  <text x="64" y="722" fill="#71717a" font-family="Arial, sans-serif" font-size="17">Numbers and labels—not color alone—communicate the sequence and review boundary.</text>
</svg>
