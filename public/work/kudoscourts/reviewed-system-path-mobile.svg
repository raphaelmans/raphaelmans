<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc">
  <title id="title">Mobile KudosCourts reviewed system path</title>
  <desc id="desc">Five readable stages from fragmented venue evidence through human review and deterministic persistence to a typed core, customer surfaces, and operations.</desc>
  <rect width="360" height="650" rx="20" fill="#f6f6f3"/>
  <text x="24" y="42" fill="#18181b" font-family="Arial, sans-serif" font-size="22" font-weight="700">Evidence to operation</text>
  <text x="24" y="66" fill="#52525b" font-family="Arial, sans-serif" font-size="14">Reviewed product path · mobile summary</text>
  <g font-family="Arial, sans-serif">
    <rect x="24" y="92" width="312" height="82" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="44" y="123" fill="#075985" font-size="14" font-weight="700">01 · EVIDENCE CAPTURE</text>
    <text x="44" y="151" fill="#18181b" font-size="17" font-weight="700">Web + maps + owner records</text>
    <path d="M180 174v24" stroke="#0369a1" stroke-width="3"/>
    <rect x="24" y="198" width="312" height="100" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <text x="44" y="229" fill="#075985" font-size="14" font-weight="700">02 · REVIEW GATE</text>
    <text x="44" y="257" fill="#18181b" font-size="17" font-weight="700">Provenance + duplicate checks</text>
    <text x="44" y="280" fill="#52525b" font-size="14">Human approval before persistence</text>
    <path d="M180 298v24" stroke="#0369a1" stroke-width="3"/>
    <rect x="24" y="322" width="312" height="82" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="44" y="353" fill="#075985" font-size="14" font-weight="700">03 · TYPED CORE</text>
    <text x="44" y="381" fill="#18181b" font-size="17" font-weight="700">Contracts + transactions</text>
    <path d="M180 404v24" stroke="#0369a1" stroke-width="3"/>
    <rect x="24" y="428" width="312" height="82" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="44" y="459" fill="#075985" font-size="14" font-weight="700">04 · CUSTOMER SURFACES</text>
    <text x="44" y="487" fill="#18181b" font-size="17" font-weight="700">Next.js web + Expo mobile</text>
    <path d="M180 510v24" stroke="#0369a1" stroke-width="3"/>
    <rect x="24" y="534" width="312" height="82" rx="14" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
    <text x="44" y="565" fill="#075985" font-size="14" font-weight="700">05 · OPERATIONS</text>
    <text x="44" y="593" fill="#18181b" font-size="17" font-weight="700">Owners + realtime + delivery</text>
  </g>
</svg>
